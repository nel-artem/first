<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Лабораторні роботи</title>
</head>
<body>
  <h1>Список файлів</h1>
  <ul>
  {% for file in site.static_files %}
    {% if file.extname == ".htm" or file.extname == ".html" %}
    <li><a href="{{ file.path | relative_url }}">{{ file.path }}</a></li>
    {% endif %}
  {% endfor %}
  </ul>
</body>
</html>
