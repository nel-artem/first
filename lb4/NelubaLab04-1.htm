<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <meta name="description" content="Лабораторна робота 4. Горизонтальні рядки, що біжать">
   <meta name="keywords" content="HTML, marquee, рядок, що біжить">
   <title>Горизонтальні рядки, що біжять</title>
</head>
<body bgcolor="#FFFFFF">
   <p align="center">
      <font color="#333333" face="Arial" size="5"><b>Горизонтальні рядки, що біжать</b></font>
   </p>

   <marquee width="100%" height="50" bgcolor="#99ff00" behavior="alternate" scrollamount="5">
      <font color="#8b008b" face="Verdana" size="4"><b><i>Ласкаво прошу на мою веб сторінку!</i></b></font>
   </marquee>
   <br>

   <marquee width="100%" height="50" bgcolor="#ffcc00" behavior="scroll" direction="left" loop="-1" scrollamount="6">
      <font color="#003366" face="Courier New" size="5"><b>Ці рядки біжать завдяки тегу MARQUEE.</b></font>
   </marquee>
   <br>

   <marquee width="100%" height="50" bgcolor="#66ccff" behavior="slide" direction="right" scrollamount="6">
      <font color="#990000" face="Times New Roman" size="6"><i>Рядки можуть мати різну швидкість.</i></font>
   </marquee>
   <br>

   <marquee width="100%" height="50" bgcolor="#ff99cc" behavior="scroll" scrolldelay="30" scrollamount="3">
      <font color="#000066" face="Comic Sans MS" size="4"><u>Цей рядок рухається плавно.</u></font>
   </marquee>
   <br>

   <marquee width="100%" height="50" bgcolor="#ccffcc" behavior="scroll" scrolldelay="300" scrollamount="10">
      <font color="#cc3300" face="Georgia" size="4"><b>А цей рядок рухається ривками.</b></font>
   </marquee>
</body>
</html>
